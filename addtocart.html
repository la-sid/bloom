<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - Bloom</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #fff8f0;
    }
    body img{
      width: 50px;
    }

    
    h1 {
      text-align: center;
      font-size: 36px;
      margin: 20px 0;
      color: #4a2c2a;
    }

    /* Cart Container */
    .cart-container {
      width: 90%;
      max-width: 1000px;
      margin: 20px auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
    }

    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #eee;
      padding: 15px 0;
    }

    .cart-item img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 5px;
      margin-right: 15px;
    }

    .item-info {
      flex: 1;
    }

    .item-info h4 {
      font-size: 18px;
      color: #4a2c2a;
      margin-bottom: 5px;
    }

    .item-info p {
      font-size: 16px;
      color: #555;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 5px;
    }

    .quantity-controls button {
      width: 25px;
      height: 25px;
      border: none;
      border-radius: 50%;
      background: #4a2c2a;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .remove-btn {
      background: none;
      border: none;
      color: red;
      cursor: pointer;
      font-size: 14px;
      margin-top: 5px;
    }

    .cart-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
    }

    .cart-footer .total {
      font-size: 20px;
      font-weight: 600;
      color: #4a2c2a;
    }

    .buy-now {
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      background: #4a2c2a;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    .buy-now:hover {
      background: #000;
    }
  </style>
</head>
<body>
  <a href="index.html"><img src="./assets/images/arrow-ios-back.svg" alt=""></a>

  
  <h1>Your Cart</h1>

  <div class="cart-container" id="cartItemsContainer">
    <!-- Cart items will be dynamically added here -->
  </div>

  <div class="cart-container cart-footer">
    <div class="total">Total: Rs. <span id="cartTotal">0</span></div>
    <a href="bill.html"><button class="buy-now" onclick="buyNow()">Buy Now</button></a>
  </div>

  <script>
    // Open product page from dropdown
    function openProductPage() {
      const select = document.getElementById('productSelect');
      if(select.value) window.location.href = select.value;
    }

    // Cart Logic
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    const cartItemsContainer = document.getElementById('cartItemsContainer');
    const cartTotal = document.getElementById('cartTotal');

    function updateCart() {
      cartItemsContainer.innerHTML = '';
      let total = 0;

     
      if(cart.length === 0) {
        cartItemsContainer.innerHTML = '<p>Your cart is empty.</p>';
      }

      cart.forEach((item, index) => {
        total += item.price * item.quantity;
        const div = document.createElement('div');
        div.classList.add('cart-item');  
        div.innerHTML = `
          <img src="${item.image}" alt="">
          <div class="item-info">
            <h4>${item.name}</h4>
            <p>Rs. ${item.price}</p>
            <div class="quantity-controls">
              <button onclick="changeQty(${index}, -1)">-</button>
              <span>${item.quantity}</span>
              <button onclick="changeQty(${index}, 1)">+</button>
            </div>
            <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
          </div>
        `;
        cartItemsContainer.appendChild(div);
      });

      cartTotal.textContent = total.toLocaleString();
      localStorage.setItem('cart', JSON.stringify(cart));
    }

    function changeQty(index, delta) {
      cart[index].quantity += delta;
      if(cart[index].quantity <= 0) cart.splice(index, 1);
      updateCart();
    }

    function removeItem(index) {
      cart.splice(index, 1);
      updateCart();
    }

    function buyNow() {
      if(cart.length === 0) {
        alert('Your cart is empty!');
        return;
      }
      alert('Thank you for your purchase!');
      cart = [];
      updateCart();
    }

    // Initial render
    updateCart();
  </script>
</body>
</html>
